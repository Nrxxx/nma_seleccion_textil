<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | NMA Selección Textil</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main style="max-width: 400px; margin: 80px auto; padding: 20px; text-align: center;">
        <h2>NMA | Selección Textil</h2>
        <p style="margin-bottom: 20px; color: #666;">Ingresa a tu cuenta</p>
        
        <form id="loginForm" style="display: flex; flex-direction: column; gap: 15px;">
            <input type="email" id="loginEmail" placeholder="Correo electrónico" required style="padding: 10px;">
            <input type="password" id="loginPassword" placeholder="Contraseña" required style="padding: 10px;">
            <button type="submit" style="padding: 12px; background: #000; color: #fff; border: none; cursor: pointer;">
                Iniciar Sesión
            </button>
        </form>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
